<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f8fc">
  <script>
    (function () {
      var mode = 'auto';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (e) {}
      var hour = new Date().getHours();
      var theme = mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeMode = mode;
      if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion');
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230e1322'/><rect x='9' y='9' width='14' height='14' fill='%23ff6b1a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/motion.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand__mark" aria-hidden="true"></span><span>{{ site.title }}<span class="brand__cursor" aria-hidden="true">_</span></span></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Log</a>
        <a href="{{ '/series/' | relative_url }}"{% if page.url == '/series/' %} aria-current="page"{% endif %}>Series</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a href="https://github.com/lehunghieu1503" target="_blank" rel="noopener noreferrer">GitHub<span class="sr-only"> (opens in a new tab)</span></a>
      </nav>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" class="theme-toggle__btn" data-theme-set="auto" aria-pressed="false">Auto</button>
        <button type="button" class="theme-toggle__btn" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" class="theme-toggle__btn" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p class="wordmark wordmark--ghost" aria-hidden="true"><span>Tinker</span> <span>Log</span></p>
      <div class="site-footer__inner">
        <span>{{ site.description }}</span>
        <span class="site-footer__meta">
          <span>{{ site.author }}</span>
          <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
        </span>
      </div>
    </div>
  </footer>
</body>
</html>
