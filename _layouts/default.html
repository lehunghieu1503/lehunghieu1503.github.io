<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101216">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2317181c'/><rect x='9' y='9' width='14' height='14' fill='%23dd5a1c'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% if page.layout == 'home' %}<link rel="preload" as="image" href="{{ '/assets/img/hero.jpg' | relative_url }}">{% endif %}
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand__mark" aria-hidden="true"></span>{{ site.title }}</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/series/' | relative_url }}"{% if page.url == '/series/' %} aria-current="page"{% endif %}>Series</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a href="https://github.com/lehunghieu1503" target="_blank" rel="noopener noreferrer">GitHub<span class="nav__ext" aria-hidden="true">&#8599;</span><span class="sr-only">(opens in a new tab)</span></a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {% if page.layout == 'home' %}
    <div class="deco" aria-hidden="true">
      <img class="deco__item deco__item--chip" src="{{ '/assets/img/motif-chip.png' | relative_url }}" alt="" width="360" height="360" loading="lazy" decoding="async">
      <img class="deco__item deco__item--gear" src="{{ '/assets/img/motif-gear.png' | relative_url }}" alt="" width="400" height="400" loading="lazy" decoding="async">
      <img class="deco__item deco__item--drone" src="{{ '/assets/img/motif-drone.png' | relative_url }}" alt="" width="480" height="326" loading="lazy" decoding="async">
    </div>
    {% endif %}
    <div class="content">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span>{{ site.description }}</span>
      <span class="site-footer__meta">
        <span>{{ site.author }}</span>
        <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
      </span>
    </div>
  </footer>
</body>
</html>
