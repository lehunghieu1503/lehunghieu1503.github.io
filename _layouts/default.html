<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f4f6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand__mark" aria-hidden="true"></span>{{ site.title }}</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a href="https://github.com/lehunghieu1503" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span>{{ site.description }}</span>
      <span class="site-footer__meta">{{ site.author }}</span>
    </div>
  </footer>
</body>
</html>
