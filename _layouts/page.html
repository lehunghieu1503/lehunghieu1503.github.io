---
layout: default
---
<article class="post">
  <header class="bio">
    {% if page.image and page.image != "" %}
    <div class="bio__media">
      <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" width="860" height="1075" loading="lazy" decoding="async">
    </div>
    {% endif %}
    <div class="bio__body">
      <h1 class="post__title">{{ page.title }}</h1>
      {% if page.lead %}<p class="bio__lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
