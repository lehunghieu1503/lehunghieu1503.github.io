---
layout: default
---
<article class="post">
  <header class="post__header">
    <p class="post__meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time>
      {% if page.tags %}<span class="post__sep" aria-hidden="true">/</span><span>{{ page.tags | join: ' / ' }}</span>{% endif %}
    </p>
    <h1 class="post__title">{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post__footer">
    <a class="post__back" href="{{ '/' | relative_url }}">Back to index</a>
  </footer>
</article>
