{%- assign s = include.seed | plus: 0 -%}
<svg class="cover" viewBox="0 0 640 320" role="presentation" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet">
  {%- for i in (1..7) -%}
  <line class="cover__grid" x1="{{ i | times: 80 }}" y1="0" x2="{{ i | times: 80 }}" y2="320"></line>
  {%- endfor -%}
  {%- for j in (1..3) -%}
  <line class="cover__grid" x1="0" y1="{{ j | times: 80 }}" x2="640" y2="{{ j | times: 80 }}"></line>
  {%- endfor -%}
  <line class="cover__axis" x1="0" y1="280" x2="640" y2="280"></line>
  {%- assign pts = "" -%}
  {%- for i in (0..13) -%}
  {%- assign h = s | times: 13 | plus: i | times: 17 | modulo: 180 -%}
  {%- assign hh = h | plus: 44 -%}
  {%- assign x = i | times: 44 | plus: 24 -%}
  {%- assign y = 280 | minus: hh -%}
  {%- assign cx = i | times: 44 | plus: 35 -%}
  <rect class="cover__bar" style="--i:{{ i }}" x="{{ x }}" y="{{ y }}" width="22" height="{{ hh }}"></rect>
  {%- assign pair = cx | append: ',' | append: y | append: ' ' -%}
  {%- assign pts = pts | append: pair -%}
  {%- endfor -%}
  <polyline class="cover__line" points="{{ pts }}"></polyline>
</svg>
