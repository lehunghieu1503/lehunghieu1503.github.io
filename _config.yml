title: tinker log
description: Technical notes on C++, Linux, robotics, automotive, and embedded systems.
author: Hieu Hung Le
url: "https://tinkerlog.io.vn"
baseurl: ""
lang: en
timezone: Asia/Ho_Chi_Minh
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/hero.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
include:
  - .htaccess
exclude:
  - README.md
  - plans/
  - Gemfile
  - Gemfile.lock
  - vendor/
